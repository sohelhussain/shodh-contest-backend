services:
  python-runner:
    image: shodh-python-runner:1
    build:
      context: ./runner
      dockerfile: Dockerfile
    command: ["true"]
    restart: "no"

  db:
    image: postgres:16-alpine
    container_name: shodh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shodh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shodh_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-shodh}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shodh} -d ${POSTGRES_DB:-shodh}"]
      interval: 3s
      timeout: 5s
      retries: 10

  migration-seed:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "npx prisma migrate deploy && (node dist/prisma/seed.js || npx ts-node prisma/seed.ts)"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shodh}:${POSTGRES_PASSWORD:-shodh_dev_password}@db:5432/${POSTGRES_DB:-shodh}?schema=public
    depends_on:
      db:
        condition: service_healthy
      python-runner:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shodh-api
    restart: unless-stopped
    command: ["node", "dist/src/main.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-shodh}:${POSTGRES_PASSWORD:-shodh_dev_password}@db:5432/${POSTGRES_DB:-shodh}?schema=public
      API_PORT: ${API_PORT:-3000}
      DEV_AUTH_SECRET: ${DEV_AUTH_SECRET:-change_me_dev_only}
      JUDGE_API_TOKEN: ${JUDGE_API_TOKEN:-change_me_judge_only}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3000:3000"
    depends_on:
      migration-seed:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "dist/src/worker.js"]
    deploy:
      replicas: 2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD:-.}/tmp/sandbox-runs:${PWD:-.}/tmp/sandbox-runs
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-shodh}:${POSTGRES_PASSWORD:-shodh_dev_password}@db:5432/${POSTGRES_DB:-shodh}?schema=public
      DEV_AUTH_SECRET: ${DEV_AUTH_SECRET:-change_me_dev_only}
      JUDGE_API_TOKEN: ${JUDGE_API_TOKEN:-change_me_judge_only}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-500}
      LEASE_SECONDS: ${LEASE_SECONDS:-30}
      HEARTBEAT_SECONDS: ${HEARTBEAT_SECONDS:-10}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
      RUNNER_MODE: ${RUNNER_MODE:-docker}
      RUNNER_IMAGE: ${RUNNER_IMAGE:-shodh-python-runner:1}
      DOCKER_HOST: unix:///var/run/docker.sock
      SANDBOX_TMP_DIR: ${PWD:-.}/tmp/sandbox-runs
      RUN_CPUS: ${RUN_CPUS:-0.5}
      RUN_MEMORY_MB: ${RUN_MEMORY_MB:-128}
      RUN_PIDS_LIMIT: ${RUN_PIDS_LIMIT:-32}
      RUN_WALL_TIME_MS: ${RUN_WALL_TIME_MS:-3000}
      RUN_OUTPUT_LIMIT_BYTES: ${RUN_OUTPUT_LIMIT_BYTES:-65536}
      FAILPOINT: ${FAILPOINT:-}
    depends_on:
      migration-seed:
        condition: service_completed_successfully

volumes:
  pgdata:
